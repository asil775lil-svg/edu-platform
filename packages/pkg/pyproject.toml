[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edupkg"
version = "1.0.0"
description = "Build, sign, encrypt and verify .edupkg educational packages"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
