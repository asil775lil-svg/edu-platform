[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-api"
version = "0.1.0"
description = "خادم منصة التعليم الذكية"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "email-validator>=2",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "alembic>=1.13",
    "edupkg",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: `Depends()`/`File()` في قيم افتراضية هو نمط FastAPI القياسي.
ignore = ["B008"]
